<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Gestão de Vendas - Sistema de Vendas e Recibos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF e AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-3 md:mb-0">
                <div class="p-2.5 bg-blue-600/30 rounded-xl border border-blue-400/30">
                    <i class="fa-solid fa-file-invoice-dollar text-2xl text-blue-300"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">RC Gestão de Vendas</h1>
                    <p class="text-xs text-blue-200">Painel Profissional de Vendas, Recibos e Notas Avulsas</p>
                </div>
            </div>
            <!-- Navegação por Abas -->
            <div class="flex flex-wrap gap-2">
                <button onclick="switchTab('vendas')" id="btn-vendas" class="px-4 py-2 rounded-xl bg-blue-600 text-white font-medium text-sm transition hover:bg-blue-500 shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-cart-plus"></i> Nova Venda
                </button>
                <button onclick="switchTab('nota-avulsa')" id="btn-nota-avulsa" class="px-4 py-2 rounded-xl bg-blue-800/80 text-blue-100 font-medium text-sm transition hover:bg-blue-700 flex items-center gap-2 border border-blue-700/50">
                    <i class="fa-solid fa-file-pen"></i> Nota Avulsa
                </button>
                <button onclick="switchTab('indicadores')" id="btn-indicadores" class="px-4 py-2 rounded-xl bg-blue-800/80 text-blue-100 font-medium text-sm transition hover:bg-blue-700 flex items-center gap-2 border border-blue-700/50">
                    <i class="fa-solid fa-chart-pie"></i> Indicadores
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- ABA 1: NOVA VENDA / REGISTRO -->
        <section id="tab-vendas" class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-6 md:p-8 border border-slate-200 max-w-2xl mx-auto">
                <div class="flex items-center gap-3 mb-6 pb-3 border-b border-slate-100">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-lg">
                        <i class="fa-solid fa-cash-register text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">Registrar Nova Venda</h2>
                        <p class="text-xs text-slate-500">Lançamento oficial para controle de faturamento</p>
                    </div>
                </div>

                <form id="form-venda" onsubmit="salvarVenda(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Seu Nome / Nome do Fornecedor *</label>
                        <input type="text" id="fornecedor" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="Ex: Dom Salgados / Seu Nome">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nome do Cliente (Comprador) *</label>
                            <input type="text" id="cliente" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="Ex: Restaurante Menino Jesus">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Produto / Serviço *</label>
                            <input type="text" id="produto" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="Ex: 585 Coxinha">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Quantidade *</label>
                            <input type="number" id="quantidade" min="1" value="1" required oninput="calcularTotal()" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Valor Unitário (R$) *</label>
                            <input type="text" id="valor_unitario" value="0,00" required oninput="calcularTotal()" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="0,00">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Total (R$)</label>
                            <input type="text" id="total_venda" readonly class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-700 font-bold text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Data da Venda *</label>
                        <input type="date" id="data_venda" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                    </div>

                    <div class="pt-3 flex flex-col sm:flex-row gap-3">
                        <button type="submit" class="flex-1 bg-blue-600 text-white font-medium py-3 px-4 rounded-xl hover:bg-blue-700 transition shadow-sm text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i> Salvar e Registrar Venda
                        </button>
                        <button type="button" onclick="limparFormulario()" class="bg-slate-100 text-slate-700 font-medium py-3 px-4 rounded-xl hover:bg-slate-200 transition text-sm">
                            Limpar
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ABA 2: NOTA AVULSA CORPORATIVA COM INTEGRAÇÃO -->
        <section id="tab-nota-avulsa" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-6 md:p-8 border border-slate-200 max-w-2xl mx-auto">
                <div class="flex items-center gap-3 mb-6 pb-3 border-b border-slate-100">
                    <div class="p-2 bg-emerald-50 text-emerald-600 rounded-lg">
                        <i class="fa-solid fa-file-shield text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">Emissão de Nota / Recibo Avulso</h2>
                        <p class="text-xs text-slate-500">Puxe dados de uma venda cadastrada ou preencha manualmente</p>
                    </div>
                </div>

                <!-- Atalho de Integração com Vendas Cadastradas -->
                <div class="mb-6 p-4 bg-blue-50/70 border border-blue-200 rounded-xl">
                    <label class="block text-xs font-bold uppercase text-blue-900 mb-1.5">
                        <i class="fa-solid fa-link mr-1"></i> Puxar Dados de Venda Cadastrada (Opcional):
                    </label>
                    <select id="select-venda-integrada" onchange="preencherNotaComVenda()" class="w-full px-3.5 py-2.5 border border-blue-300 rounded-xl bg-white text-sm text-slate-700 focus:ring-2 focus:ring-blue-600">
                        <option value="">Selecione uma venda cadastrada para preencher automático...</option>
                    </select>
                </div>

                <form id="form-nota-avulsa" onsubmit="gerarNotaAvulsaPDF(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">
