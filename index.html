<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Gestão de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-6">
        
        <!-- Cabeçalho -->
        <header class="bg-gradient-to-r from-blue-700 to-indigo-800 p-5 rounded-2xl shadow-lg">
            <h1 class="text-xl font-bold">RC Gestão de Vendas</h1>
            <p class="text-xs text-blue-200 mt-1">Painel Profissional de Vendas, Recibos e Notas Avulsas</p>
            
            <!-- Botões de Navegação -->
            <div class="grid grid-cols-3 gap-2 mt-4">
                <button onclick="mudarAba('venda')" id="btn-venda" class="bg-blue-600 hover:bg-blue-500 text-xs py-2 px-3 rounded-xl font-medium transition text-center shadow">Nova Venda</button>
                <button onclick="mudarAba('nota')" id="btn-nota" class="bg-slate-700 hover:bg-slate-600 text-xs py-2 px-3 rounded-xl font-medium transition text-center shadow">Nota Avulsa</button>
                <button onclick="mudarAba('indicadores')" id="btn-indicadores" class="bg-slate-700 hover:bg-slate-600 text-xs py-2 px-3 rounded-xl font-medium transition text-center shadow">Indicadores</button>
            </div>
        </header>

        <!-- ABA 1: REGISTRAR NOVA VENDA -->
        <section id="aba-venda" class="bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">🛒 Registrar Nova Venda</h2>
            
            <form id="formVenda" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">SEU NOME / NOME DO FORNECEDOR *</label>
                    <input type="text" id="fornecedor" value="Dom Salgados" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">NOME DO CLIENTE (COMPRADOR) *</label>
                    <input type="text" id="cliente" placeholder="Ex: Restaurante Menino Jesus" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">PRODUTO / SERVIÇO *</label>
                    <input type="text" id="produto" placeholder="Ex: 585 Coxinhas" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">QUANTIDADE *</label>
                        <input type="text" id="quantidade" value="1" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">VALOR UNITÁRIO (R$) *</label>
                        <input type="text" id="valorUnitario" value="0.00" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">TOTAL (R$)</label>
                    <input type="text" id="valorTotal" readonly class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-emerald-400 font-bold">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">DATA DA VENDA *</label>
                    <input type="date" id="dataVenda" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-semibold text-sm transition shadow-lg">Salvar Venda</button>
            </form>
        </section>

        <!-- ABA 2: NOTA AVULSA -->
        <section id="aba-nota" class="bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700 space-y-4 hidden">
            <h2 class="text-lg font-semibold flex items-center gap-2">📄 Nota Avulsa / Recibo</h2>
            <div id="conteudoNota" class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-sm space-y-2">
                <p class="text-slate-400 text-center">Nenhuma venda selecionada ou registrada recente.</p>
            </div>
            <button onclick="window.print()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-semibold text-sm transition shadow-lg">Imprimir / Salvar PDF</button>
        </section>

        <!-- ABA 3: INDICADORES -->
        <section id="aba-indicadores" class="bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700 space-y-4 hidden">
            <h2 class="text-lg font-semibold flex items-center gap-2">📊 Indicadores de Vendas</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400">Total de Vendas</span>
                    <p id="indTotalVendas" class="text-lg font-bold text-blue-400">0</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400">Faturamento</span>
                    <p id="indFaturamento" class="text-lg font-bold text-emerald-400">R$ 0,00</p>
                </div>
            </div>
            <div class="space-y-2">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Histórico Recente</h3>
                <div id="listaHistorico" class="space-y-2 max-h-60 overflow-y-auto">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </section>

    </div>

    <script>
        // Data atual no input
        document.getElementById('dataVenda').valueAsDate = new Date();

        // Conversor seguro aceitando ponto (.) e vírgula (,)
        function parseNumero(valor) {
            if (!valor) return 0;
            if (typeof valor === 'number') return valor;
            let limpo = valor.toString().trim().replace(/\s/g, '');
            // Se tem ponto e vírgula, assume formato brasileiro 1.234,56
            if (limpo.includes('.') && limpo.includes(',')) {
                limpo = limpo.replace(/\./g, '').replace(',', '.');
            } else if (limpo.includes(',')) {
                limpo = limpo.replace(',', '.');
            }
            return parseFloat(limpo) || 0;
        }

        // Cálculo Automático
        const inputQtd = document.getElementById('quantidade');
        const inputUnit = document.getElementById('valorUnitario');
        const inputTotal = document.getElementById('valorTotal');

        function calcular() {
            let qtd = parseNumero(inputQtd.value);
            let unit = parseNumero(inputUnit.value);
            let total = qtd * unit;
            inputTotal.value = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        inputQtd.addEventListener('input', calcular);
        inputUnit.addEventListener('input', calcular);
        calcular();

        // Troca de Abas Segura
        function mudarAba(aba) {
            ['venda', 'nota', 'indicadores'].forEach(a => {
                document.getElementById(`aba-${a}`).classList.add('hidden');
                document.getElementById(`btn-${a}`).className = "bg-slate-700 hover:bg-slate-600 text-xs py-2 px-3 rounded-xl font-medium transition text-center shadow";
            });
            document.getElementById(`aba-${aba}`).classList.remove('hidden');
            document.getElementById(`btn-${aba}`).className = "bg-blue-600 hover:bg-blue-500 text-xs py-2 px-3 rounded-xl font-medium transition text-center shadow";

            if (aba === 'indicadores') atualizarIndicadores();
            if (aba === 'nota') atualizarNotaAvulsa();
        }

        // Salvar Vendas (localStorage)
        let vendas = JSON.parse(localStorage.getItem('rc_vendas')) || [];

        document.getElementById('formVenda').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const novaVenda = {
                id: Date.now(),
                fornecedor: document.getElementById('fornecedor').value,
                cliente: document.getElementById('cliente').value,
                produto: document.getElementById('produto').value,
                quantidade: parseNumero(inputQtd.value),
                valorUnitario: parseNumero(inputUnit.value),
                valorTotal: parseNumero(inputQtd.value) * parseNumero(inputUnit.value),
                data: document.getElementById('dataVenda').value
            };

            vendas.unshift(novaVenda); // Adiciona no início
            localStorage.setItem('rc_vendas', JSON.stringify(vendas));

            alert('Venda registrada com sucesso!');
            this.reset();
            document.getElementById('dataVenda').valueAsDate = new Date();
            document.getElementById('fornecedor').value = "Dom Salgados";
            calcular();
            mudarAba('indicadores');
        });

        // Atualizar Indicadores e Histórico
        function atualizarIndicadores() {
            vendas = JSON.parse(localStorage.getItem('rc_vendas')) || [];
            document.getElementById('indTotalVendas').innerText = vendas.length;
            
            let faturamentoTotal = vendas.reduce((acc, v) => acc + v.valorTotal, 0);
            document.getElementById('indFaturamento').innerText = faturamentoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            let html = '';
            if (vendas.length === 0) {
                html = '<p class="text-xs text-slate-500 text-center py-4">Nenhuma venda registrada ainda.</p>';
            } else {
                vendas.forEach(v => {
                    html += `
                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-xs space-y-1">
                            <div class="flex justify-between font-semibold">
                                <span class="text-blue-400">${v.cliente}</span>
                                <span class="text-emerald-400">${v.valorTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                            </div>
                            <div class="text-slate-400">${v.produto} (Qtd: ${v.quantidade})</div>
                            <div class="text-slate-500 text-[10px]">Data: ${v.data.split('-').reverse().join('/')} | Fornecedor: ${v.fornecedor}</div>
                        </div>
                    `;
                });
            }
            document.getElementById('listaHistorico').innerHTML = html;
        }

        // Atualizar Nota Avulsa com a última venda
        function atualizarNotaAvulsa() {
            vendas = JSON.parse(localStorage.getItem('rc_vendas')) || [];
            const container = document.getElementById('conteudoNota');
            if (vendas.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center">Nenhuma venda registrada para gerar nota.</p>';
                return;
            }
            const v = vendas[0]; // Pega a última venda
            container.innerHTML = `
                <div class="border-b border-slate-800 pb-2 mb-2">
                    <p class="font-bold text-base text-blue-400">${v.fornecedor}</p>
                    <p class="text-xs text-slate-400">Comprovante de Venda / Nota Avulsa</p>
                </div>
                <div class="space-y-1">
                    <p><strong>Cliente:</strong> ${v.cliente}</p>
                    <p><strong>Produto/Serviço:</strong> ${v.produto}</p>
                    <p><strong>Quantidade:</strong> ${v.quantidade}</p>
                    <p><strong>Valor Unitário:</strong> ${v.valorUnitario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</p>
                    <p class="text-emerald-400 font-bold pt-2 border-t border-slate-800">Total: ${v.valorTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</p>
                    <p class="text-[10px] text-slate-500 pt-1">Data: ${v.data.split('-').reverse().join('/')}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
